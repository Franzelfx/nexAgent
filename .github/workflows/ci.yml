name: CI

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - nxpcore-updated
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nex-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ci/lint (nex-agent)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint sources
        run: python -m compileall -q src

  test:
    name: ci/test (nex-agent)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: |
          if [ -d tests ]; then
            pytest tests -q --maxfail=1
          else
            echo "No local tests directory for nex-agent, skipping tests."
          fi

  build:
    name: ci/build (nex-agent)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout nxpCore (pinned)
        uses: actions/checkout@v4
        with:
          repository: Franzelfx/nxpCore
          ref: 9fd3cac10d348d173f3d5085c0cd389163999547
          path: nxpCore
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build image locally
        run: docker build -f Dockerfile -t nex-agent:ci .

  nxpcore-main-compat:
    name: compat/nxpcore-main (nex-agent)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout nxpCore (main)
        uses: actions/checkout@v4
        with:
          repository: Franzelfx/nxpCore
          ref: main
          path: nxpCore
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}

      - name: Build image against nxpCore/main (non-blocking)
        run: docker build -f Dockerfile -t nex-agent:nxpcore-main .
